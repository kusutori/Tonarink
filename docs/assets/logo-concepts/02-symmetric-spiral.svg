    <path fill="url(#tealReturn)" d="M863 279V198C863 180 875 180 888 187C909 198 925 215 930 230C936 245 904 262 863 279Z"/>
    <path fill="url(#aquaFace)" d="M601 232C601 196 624 170 663 151L788 97C813 86 832 101 832 127V143C832 170 819 190 793 202L694 248C662 263 632 286 619 303C614 309 613 315 616 321C606 315 601 303 601 286V232Z"/>
    <path fill="url(#tealFace)" d="M734 394V373C734 345 751 322 782 308L892 259C915 248 933 239 930 229C941 245 946 263 945 285C945 323 931 347 898 366L775 421C753 431 734 418 734 394Z"/>
    <path d="M738 354C745 334 761 318 782 308L892 259C914 249 933 239 930 229" stroke="url(#foldLight)" stroke-width="1.2"/>
  </g>
