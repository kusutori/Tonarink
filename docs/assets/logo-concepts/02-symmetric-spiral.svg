<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Tonarink — symmetrical spiral concept</title>
  <desc id="description">Vector reconstruction of original concept 02: two opposing aqua and teal ribbons curl around an open centre.</desc>
  <defs>
    <linearGradient id="aquaFace" x1="612" y1="279" x2="815" y2="109" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06C7D6"/>
      <stop offset="0.48" stop-color="#41E1EB"/>
      <stop offset="1" stop-color="#9BF7FC"/>
    </linearGradient>
    <linearGradient id="aquaReturn" x1="636" y1="275" x2="740" y2="356" gradientUnits="userSpaceOnUse">
      <stop stop-color="#007C8C"/>
      <stop offset="0.48" stop-color="#12ADBD"/>
      <stop offset="1" stop-color="#5EDCE5"/>
    </linearGradient>
    <linearGradient id="tealReturn" x1="866" y1="189" x2="915" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#009BAE"/>
      <stop offset="1" stop-color="#00596D"/>
    </linearGradient>
    <linearGradient id="tealFace" x1="900" y1="254" x2="771" y2="425" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00ADBD"/>
      <stop offset="0.52" stop-color="#008F9F"/>
      <stop offset="1" stop-color="#006479"/>
    </linearGradient>
    <linearGradient id="foldLight" x1="750" y1="341" x2="922" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BAFAFC" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#BAFAFC" stop-opacity="0"/>
    </linearGradient>
  </defs>
