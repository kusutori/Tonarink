name: Tonarink GitHub Release

on:
  push:
    tags:
      - "app-v[0-9]+.[0-9]+.[0-9]+"
      - "app-v[0-9]+.[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Application release tag, for example app-v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  APP_PROJECT: src/Tonarink.App/Tonarink.App.csproj
  APP_MANIFEST: src/Tonarink.App/Package.appxmanifest

jobs:
  portable:
    name: Build portable ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          if ($tag.StartsWith('app-', [StringComparison]::OrdinalIgnoreCase)) {
            $tag = $tag.Substring(4)
          }
          $version = $tag
          if ($version.StartsWith('v', [StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "Version '$version' must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH.REVISION."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: |
          dotnet restore ${{ env.APP_PROJECT }} -p:Platform=${{ matrix.platform }} -p:NativeAot=true -r ${{ matrix.rid }}
          dotnet restore src/Tonarink.ExplorerCommand/Tonarink.ExplorerCommand.csproj -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }}
          dotnet restore src/Tonarink.WidgetProvider/Tonarink.WidgetProvider.csproj -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }}

      - name: Publish Native AOT application
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "publish-${{ matrix.platform }}"
          dotnet publish $env:APP_PROJECT --no-restore -c Release `
            -r ${{ matrix.rid }} `
            -p:Platform=${{ matrix.platform }} `
            -p:NativeAot=true `
            -p:Version=${{ steps.release.outputs.version }} `
            -o $publishDir

          $requiredFiles = @('Tonarink.exe', 'Tonarink.pri')
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path (Join-Path $publishDir $requiredFile))) {
              throw "Publish output is missing $requiredFile."
            }
          }
          if ((Get-ChildItem (Join-Path $publishDir 'Strings') -Recurse -Filter *.resw).Count -lt 1) {
            throw 'Publish output is missing localized RESW files.'
          }

          Copy-Item README.md, LICENSE, NOTICE -Destination $publishDir
          $symbols = Get-Item (Join-Path $publishDir 'Tonarink.pdb')
          $symbolsArchive = Join-Path $env:RUNNER_TEMP "Tonarink-${{ steps.release.outputs.version }}-${{ matrix.platform }}-symbols.zip"
          Compress-Archive -Path $symbols.FullName -DestinationPath $symbolsArchive -CompressionLevel Optimal
          Remove-Item $symbols.FullName -Force

          $archive = Join-Path $env:RUNNER_TEMP "Tonarink-${{ steps.release.outputs.version }}-${{ matrix.platform }}-portable.zip"
          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: ${{ runner.temp }}/Tonarink-${{ steps.release.outputs.version }}-${{ matrix.platform }}-*.zip
          if-no-files-found: error

  signed-msix:
    name: Build signed MSIX ${{ matrix.platform }}${{ matrix.suffix }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
            widgets: false
            suffix: ""
          - platform: ARM64
            rid: win-arm64
            widgets: false
            suffix: ""
          - platform: x64
            rid: win-x64
            widgets: true
            suffix: "-widgets"
          - platform: ARM64
            rid: win-arm64
            widgets: true
            suffix: "-widgets"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate signing configuration
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            throw 'Missing GitHub Actions secret MSIX_CERTIFICATE_BASE64.'
          }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) {
            throw 'Missing GitHub Actions secret MSIX_CERTIFICATE_PASSWORD.'
          }

      - name: Stamp package version
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $version = ./build/Set-PackageIdentity.ps1 `
            -ManifestPath $env:APP_MANIFEST `
            -Tag $env:RELEASE_TAG
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Import signing certificate
        id: certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          [xml]$manifest = Get-Content -LiteralPath $env:APP_MANIFEST -Raw
          $expectedPublisher = $manifest.Package.Identity.Publisher
          $certificatePath = Join-Path $env:RUNNER_TEMP 'release-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          if ($certificate.Subject -ne $expectedPublisher) {
            throw "Certificate subject '$($certificate.Subject)' does not match manifest publisher '$expectedPublisher'."
          }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          "pfx=$certificatePath" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: |
          dotnet restore ${{ env.APP_PROJECT }} -p:Platform=${{ matrix.platform }} -p:RuntimeIdentifier=${{ matrix.rid }} -p:TonarinkPackaged=true
          dotnet restore src/Tonarink.ExplorerCommand/Tonarink.ExplorerCommand.csproj -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }}
          dotnet restore src/Tonarink.WidgetProvider/Tonarink.WidgetProvider.csproj -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }}

      - name: Build signed MSIX
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          RID: ${{ matrix.rid }}
          THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $releaseVersion = $env:PACKAGE_VERSION -replace '\.0$', ''
          $suffix = '${{ matrix.suffix }}'
          $archive = Join-Path $env:RUNNER_TEMP "Tonarink-$releaseVersion-$env:PLATFORM$suffix-msix.zip"
          $packageDir = Join-Path $env:RUNNER_TEMP 'AppPackages\'
          $widgets = '${{ matrix.widgets }}'
          dotnet build $env:APP_PROJECT --no-restore -c Release `
            -p:Platform=$env:PLATFORM `
            -p:RuntimeIdentifier=$env:RID `
            -p:TonarinkPackaged=true `
            -p:TonarinkWidgets=$widgets `
            -p:GenerateAppxPackageOnBuild=true `
            -p:GenerateTestArtifacts=true `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint=$env:THUMBPRINT `
            -p:AppxPackageDir=$packageDir
          if ($LASTEXITCODE -ne 0) {
            throw "Packaging the $env:PLATFORM$suffix MSIX failed."
          }

          $packageFolder = Get-ChildItem $packageDir -Directory -Recurse |
            Where-Object { $_.Name -like '*_Test' } |
            Select-Object -First 1
          if ($null -eq $packageFolder) {
            throw 'The build completed without producing a standard AppPackages Test folder.'
          }

          foreach ($requiredName in @('Install.ps1', 'Add-AppDevPackage.ps1')) {
            if (-not (Test-Path (Join-Path $packageFolder.FullName $requiredName))) {
              throw "The package folder is missing $requiredName."
            }
          }
          $msix = Get-ChildItem $packageFolder.FullName -Filter *.msix | Select-Object -First 1
          if ($null -eq $msix) {
            throw 'The package folder is missing an MSIX file.'
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try {
            $hasWidget = [bool]($zip.Entries.FullName | Where-Object { $_ -match 'WidgetProvider[/\\]Tonarink\.WidgetProvider\.exe$' })
          }
          finally {
            $zip.Dispose()
          }
          if ($widgets -eq 'true' -and -not $hasWidget) {
            throw 'The Widgets MSIX is missing Tonarink.WidgetProvider.exe.'
          }
          if ($widgets -ne 'true' -and $hasWidget) {
            throw 'The default MSIX must not include Tonarink.WidgetProvider.exe.'
          }

          Compress-Archive -Path $packageFolder.FullName -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload signed package
        uses: actions/upload-artifact@v4
        with:
          name: signed-msix-${{ matrix.platform }}${{ matrix.suffix }}
          path: ${{ runner.temp }}/Tonarink-*-${{ matrix.platform }}${{ matrix.suffix }}-msix.zip
          if-no-files-found: error

      - name: Remove signing certificate
        if: always() && steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        run: |
          Remove-Item "Cert:\CurrentUser\My\${{ steps.certificate.outputs.thumbprint }}" -Force -ErrorAction SilentlyContinue
          Remove-Item "${{ steps.certificate.outputs.pfx }}" -Force -ErrorAction SilentlyContinue

  signed-aot-msix:
    name: Build signed Native AOT MSIX ${{ matrix.platform }}${{ matrix.suffix }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
            architecture: x64
            widgets: false
            suffix: ""
          - platform: ARM64
            rid: win-arm64
            architecture: arm64
            widgets: false
            suffix: ""
          - platform: x64
            rid: win-x64
            architecture: x64
            widgets: true
            suffix: "-widgets"
          - platform: ARM64
            rid: win-arm64
            architecture: arm64
            widgets: true
            suffix: "-widgets"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate signing configuration
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            throw 'Missing GitHub Actions secret MSIX_CERTIFICATE_BASE64.'
          }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) {
            throw 'Missing GitHub Actions secret MSIX_CERTIFICATE_PASSWORD.'
          }

      - name: Stamp package version
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $packageVersion = ./build/Set-PackageIdentity.ps1 `
            -ManifestPath $env:APP_MANIFEST `
            -Tag $env:RELEASE_TAG
          $releaseVersion = $env:RELEASE_TAG.Trim() -replace '^app-', '' -replace '^v', ''
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "release_version=$releaseVersion" >> $env:GITHUB_OUTPUT

      - name: Import signing certificate
        id: certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          [xml]$manifest = Get-Content -LiteralPath $env:APP_MANIFEST -Raw
          $expectedPublisher = $manifest.Package.Identity.Publisher
          $certificatePath = Join-Path $env:RUNNER_TEMP 'release-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          if ($certificate.Subject -ne $expectedPublisher) {
            throw "Certificate subject '$($certificate.Subject)' does not match manifest publisher '$expectedPublisher'."
          }
          $publicCertificatePath = Join-Path $env:RUNNER_TEMP 'release-signing.cer'
          Export-Certificate -Cert $certificate -FilePath $publicCertificatePath -Type CERT | Out-Null
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          "pfx=$certificatePath" >> $env:GITHUB_OUTPUT
          "cer=$publicCertificatePath" >> $env:GITHUB_OUTPUT

      - name: Restore Native AOT application
        run: |
          dotnet restore ${{ env.APP_PROJECT }} -p:Platform=${{ matrix.platform }} -p:NativeAot=true -r ${{ matrix.rid }}
          dotnet restore src/Tonarink.ExplorerCommand/Tonarink.ExplorerCommand.csproj -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }}
          dotnet restore src/Tonarink.WidgetProvider/Tonarink.WidgetProvider.csproj -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }}

      - name: Publish Native AOT layout
        shell: pwsh
        run: |
          $layout = Join-Path $env:RUNNER_TEMP 'aot-msix-layout'
          $widgets = '${{ matrix.widgets }}'
          dotnet publish $env:APP_PROJECT --no-restore -c Release `
            -r ${{ matrix.rid }} `
            -p:Platform=${{ matrix.platform }} `
            -p:NativeAot=true `
            -p:TonarinkPackaged=false `
            -p:WindowsPackageType=None `
            -p:TonarinkWidgets=$widgets `
            -p:Version=${{ steps.package.outputs.release_version }} `
            -o $layout
          if ($LASTEXITCODE -ne 0) {
            throw 'Publishing the Native AOT layout failed.'
          }

          foreach ($requiredFile in @('Tonarink.exe', 'Tonarink.pri')) {
            if (-not (Test-Path (Join-Path $layout $requiredFile))) {
              throw "Native AOT layout is missing $requiredFile."
            }
          }
          $widgetHost = Join-Path $layout 'WidgetProvider\Tonarink.WidgetProvider.exe'
          if ($widgets -eq 'true' -and -not (Test-Path $widgetHost)) {
            throw 'The Widgets Native AOT layout is missing Tonarink.WidgetProvider.exe.'
          }
          if ($widgets -ne 'true' -and (Test-Path $widgetHost)) {
            throw 'The default Native AOT MSIX must not include the Widgets COM host.'
          }

          Get-ChildItem -LiteralPath $layout -Filter '*.pdb' -File |
            Remove-Item -Force -ErrorAction SilentlyContinue

          $assets = Join-Path $layout 'Assets'
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          Copy-Item 'src/Tonarink.App/Assets/*.png' -Destination $assets
          Copy-Item 'src/Tonarink.App/Assets/*.ico' -Destination $assets
          $manifestPath = Join-Path $layout 'AppxManifest.xml'
          if ($widgets -eq 'true') {
            ./tools/Add-WidgetManifestExtensions.ps1 `
              -Source $env:APP_MANIFEST `
              -Destination $manifestPath
          } else {
            Copy-Item $env:APP_MANIFEST -Destination $manifestPath
          }
          [xml]$manifest = Get-Content -LiteralPath $manifestPath -Raw
          $manifest.Package.Identity.SetAttribute('ProcessorArchitecture', '${{ matrix.architecture }}')
          $manifest.Package.Applications.Application.SetAttribute('EntryPoint', 'Windows.FullTrustApplication')
          $settings = [Xml.XmlWriterSettings]::new()
          $settings.Indent = $true
          $settings.Encoding = [Text.UTF8Encoding]::new($false)
          $writer = [Xml.XmlWriter]::Create($manifestPath, $settings)
          try {
            $manifest.Save($writer)
          }
          finally {
            $writer.Dispose()
          }

          ./tools/New-AotMsixResourcesPri.ps1 -LayoutPath $layout
          if (-not (Test-Path (Join-Path $layout 'resources.pri'))) {
            throw 'AOT MSIX layout is missing resources.pri.'
          }

      - name: Pack and sign Native AOT MSIX
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          $sdkBinRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $sdkTools = Get-ChildItem -LiteralPath $sdkBinRoot -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'x64\makeappx.exe') } |
            Sort-Object { [Version]$_.Name } -Descending |
            Select-Object -First 1
          if ($null -eq $sdkTools) {
            throw 'A Windows SDK containing makeappx.exe and signtool.exe was not found.'
          }

          $makeAppx = Join-Path $sdkTools.FullName 'x64\makeappx.exe'
          $signTool = Join-Path $sdkTools.FullName 'x64\signtool.exe'
          $layout = Join-Path $env:RUNNER_TEMP 'aot-msix-layout'
          $packageName = 'Tonarink-${{ steps.package.outputs.release_version }}-${{ matrix.platform }}-aot${{ matrix.suffix }}.msix'
          $packagePath = Join-Path $env:RUNNER_TEMP $packageName

          & $makeAppx pack /o /d $layout /p $packagePath
          if ($LASTEXITCODE -ne 0) {
            throw 'makeappx failed to create the Native AOT MSIX.'
          }
          & $signTool sign /fd SHA256 /s My /sha1 $env:THUMBPRINT $packagePath
          if ($LASTEXITCODE -ne 0) {
            throw 'signtool failed to sign the Native AOT MSIX.'
          }

          $packageFolder = Join-Path $env:RUNNER_TEMP "Tonarink_${{ steps.package.outputs.package_version }}_${{ matrix.platform }}_AOT${{ matrix.suffix }}_Test"
          New-Item -ItemType Directory -Path $packageFolder | Out-Null
          Copy-Item $packagePath -Destination $packageFolder
          Copy-Item 'tools/Install-MsixSideload.ps1' -Destination (Join-Path $packageFolder 'Install.ps1')
          Copy-Item 'docs/development-msix-install.md' -Destination (Join-Path $packageFolder 'README.md')
          Copy-Item LICENSE, NOTICE -Destination $packageFolder
          Copy-Item '${{ steps.certificate.outputs.cer }}' `
            -Destination (Join-Path $packageFolder 'Tonarink-Development.cer')

          $archive = Join-Path $env:RUNNER_TEMP 'Tonarink-${{ steps.package.outputs.release_version }}-${{ matrix.platform }}-aot${{ matrix.suffix }}-msix.zip'
          Compress-Archive -Path $packageFolder -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload signed Native AOT package
        uses: actions/upload-artifact@v4
        with:
          name: signed-aot-msix-${{ matrix.platform }}${{ matrix.suffix }}
          path: ${{ runner.temp }}/Tonarink-${{ steps.package.outputs.release_version }}-${{ matrix.platform }}-aot${{ matrix.suffix }}-msix.zip
          if-no-files-found: error

      - name: Remove signing certificate
        if: always() && steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        run: |
          Remove-Item "Cert:\CurrentUser\My\${{ steps.certificate.outputs.thumbprint }}" -Force -ErrorAction SilentlyContinue
          Remove-Item "${{ steps.certificate.outputs.pfx }}" -Force -ErrorAction SilentlyContinue
          Remove-Item "${{ steps.certificate.outputs.cer }}" -Force -ErrorAction SilentlyContinue

  web:
    # Experimental Blazor/Hybrid publishing is intentionally paused while the
    # Reactor application remains the active product release target.
    if: ${{ false }}
    name: Build Web host ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rid: win-x64
          - name: linux-x64
            os: ubuntu-latest
            rid: linux-x64
          - name: linux-arm64
            os: ubuntu-latest
            rid: linux-arm64
          - name: macos-x64
            os: macos-latest
            rid: osx-x64
          - name: macos-arm64
            os: macos-latest
            rid: osx-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Trim() -replace '^app-', '' -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "Version '$version' must be numeric."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained Web host
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'tonarink-web'
          dotnet publish src/Tonarink.Web/Tonarink.Web.csproj -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:Version=${{ steps.release.outputs.version }} `
            -o $publishDir
          if ($LASTEXITCODE -ne 0) {
            throw 'Publishing the Web host failed.'
          }
          Copy-Item README.md, LICENSE, NOTICE -Destination $publishDir
          $archive = Join-Path $env:RUNNER_TEMP 'Tonarink-${{ steps.release.outputs.version }}-web-${{ matrix.name }}.zip'
          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload Web host
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.name }}
          path: ${{ runner.temp }}/Tonarink-${{ steps.release.outputs.version }}-web-${{ matrix.name }}.zip
          if-no-files-found: error

  android:
    # Keep the signed packaging recipe ready for the next development phase,
    # but do not attach experimental mobile builds to Reactor releases yet.
    if: ${{ false }}
    name: Build signed Android app
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.signing.outputs.configured }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Detect Android signing configuration
        id: signing
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $configured = @(
            $env:KEYSTORE_BASE64,
            $env:KEY_ALIAS,
            $env:KEYSTORE_PASSWORD,
            $env:KEY_PASSWORD
          ) | Where-Object { [string]::IsNullOrWhiteSpace($_) }
          if ($configured.Count -gt 0) {
            "configured=false" >> $env:GITHUB_OUTPUT
            Write-Warning 'Android signing secrets are incomplete; Android release assets will be skipped.'
          } else {
            "configured=true" >> $env:GITHUB_OUTPUT
          }

      - name: Install MAUI workload
        if: steps.signing.outputs.configured == 'true'
        run: dotnet workload install maui

      - name: Resolve Android version
        if: steps.signing.outputs.configured == 'true'
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Trim() -replace '^app-', '' -replace '^v', ''
          if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?$') {
            throw "Version '$version' must be numeric."
          }
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $patch = [int]$Matches[3]
          $revision = [int]($Matches[4] ?? 0)
          if ($major -gt 20 -or $minor -gt 999 -or $patch -gt 999 -or $revision -gt 99) {
            throw "Version '$version' is too large for the Android version-code mapping."
          }
          $code = ($major * 100000000) + ($minor * 100000) + ($patch * 100) + $revision
          if ($code -lt 1 -or $code -gt [int]::MaxValue) {
            throw "Version '$version' cannot be represented as an Android version code."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "code=$code" >> $env:GITHUB_OUTPUT

      - name: Import Android signing key
        if: steps.signing.outputs.configured == 'true'
        id: keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'tonarink-release.keystore'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Publish signed APK and app bundle
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $project = 'src/Tonarink.Hybrid/Tonarink.Hybrid.csproj'
          foreach ($format in @('apk', 'aab')) {
            $publishDir = Join-Path $env:RUNNER_TEMP "android-$format"
            dotnet publish $project `
              -f net10.0-android `
              -c Release `
              -p:ApplicationDisplayVersion=${{ steps.release.outputs.version }} `
              -p:ApplicationVersion=${{ steps.release.outputs.code }} `
              -p:AndroidPackageFormats=$format `
              -p:AndroidKeyStore=true `
              -p:AndroidSigningKeyStore='${{ steps.keystore.outputs.path }}' `
              -p:AndroidSigningKeyAlias="$env:KEY_ALIAS" `
              -p:AndroidSigningStorePass="$env:KEYSTORE_PASSWORD" `
              -p:AndroidSigningKeyPass="$env:KEY_PASSWORD" `
              -o $publishDir
            if ($LASTEXITCODE -ne 0) {
              throw "Publishing the signed Android $format failed."
            }
          }

          $apk = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'android-apk') -Recurse -File -Filter '*-Signed.apk' | Select-Object -First 1
          $aab = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'android-aab') -Recurse -File -Filter '*-Signed.aab' | Select-Object -First 1
          if ($null -eq $apk -or $null -eq $aab) {
            throw 'Android publish did not produce both a signed APK and AAB.'
          }
          Copy-Item $apk.FullName (Join-Path $env:RUNNER_TEMP 'Tonarink-${{ steps.release.outputs.version }}-android.apk')
          Copy-Item $aab.FullName (Join-Path $env:RUNNER_TEMP 'Tonarink-${{ steps.release.outputs.version }}-android.aab')

      - name: Upload Android packages
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-signed
          path: |
            ${{ runner.temp }}/Tonarink-${{ steps.release.outputs.version }}-android.apk
            ${{ runner.temp }}/Tonarink-${{ steps.release.outputs.version }}-android.aab
          if-no-files-found: error

      - name: Remove Android signing key
        if: always() && steps.keystore.outputs.path != ''
        shell: pwsh
        run: Remove-Item '${{ steps.keystore.outputs.path }}' -Force -ErrorAction SilentlyContinue

  release:
    name: Create GitHub Release
    needs:
      - portable
      - signed-msix
      - signed-aot-msix
    runs-on: windows-latest
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: "portable-*"
          path: packages
          merge-multiple: true

      - name: Download signed MSIX packages
        uses: actions/download-artifact@v4
        with:
          pattern: "signed-msix-*"
          path: packages
          merge-multiple: true

      - name: Download signed Native AOT MSIX packages
        uses: actions/download-artifact@v4
        with:
          pattern: "signed-aot-msix-*"
          path: packages
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          generate_release_notes: true
          prerelease: true
          body: |
            ## Choose a download / 下载选择

            | Asset / 产物 | Architecture / 架构 | Recommended for / 适合场景 |
            | --- | --- | --- |
            | `Tonarink-<version>-x64-msix.zip` | x64 | **Recommended for most Intel/AMD Windows PCs.** Signed MSIX with the standard managed build. / 推荐大多数 Intel/AMD Windows 电脑使用。 |
            | `Tonarink-<version>-ARM64-msix.zip` | ARM64 | **Recommended for Windows on Arm.** Signed MSIX with the standard managed build. / 推荐骁龙等 ARM64 Windows 设备使用。 |
            | `Tonarink-<version>-x64-widgets-msix.zip` | x64 | Optional build that registers a Windows 11 widget (Native AOT host). Same package identity as the standard MSIX. / 可选的带小组件版本。 |
            | `Tonarink-<version>-ARM64-widgets-msix.zip` | ARM64 | Optional Widgets MSIX for Windows on Arm. / ARM64 带小组件的可选安装包。 |
            | `Tonarink-<version>-x64-aot-msix.zip` | x64 | Installed Native AOT build with faster startup and no separate .NET runtime requirement. / 安装版 Native AOT。 |
            | `Tonarink-<version>-ARM64-aot-msix.zip` | ARM64 | Native AOT MSIX for Windows on Arm. / ARM64 安装版 Native AOT。 |
            | `Tonarink-<version>-x64-aot-widgets-msix.zip` | x64 | Native AOT MSIX with the Windows 11 widget host. / 带小组件的 Native AOT 安装包。 |
            | `Tonarink-<version>-ARM64-aot-widgets-msix.zip` | ARM64 | Native AOT Widgets MSIX for Windows on Arm. / ARM64 带小组件的 Native AOT 安装包。 |
            | `Tonarink-<version>-x64-portable.zip` | x64 | Native AOT build that runs without installation. / 无需安装的 x64 便携版。 |
            | `Tonarink-<version>-ARM64-portable.zip` | ARM64 | Native AOT build that runs without installation. / 无需安装的 ARM64 便携版。 |

            Extract an MSIX ZIP and run `Install.ps1`. The included self-signed certificate is installed for sideloading. Files ending in `-symbols.zip` contain PDBs for debugging and are not application downloads.

            解压 MSIX ZIP 后运行 `Install.ps1`；安装脚本会导入随附的自签名证书。`-symbols.zip` 仅包含调试符号，普通用户无需下载。

          files: packages/*
