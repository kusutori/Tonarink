name: Store listing validation

on:
  pull_request:
    paths:
      - store-listing/**
      - tools/Test-StoreListing.ps1
      - .github/workflows/store-listing.yml
  push:
    branches: [main]
    paths:
      - store-listing/**
      - tools/Test-StoreListing.ps1
      - .github/workflows/store-listing.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Store listing copy
        shell: pwsh
        run: ./tools/Test-StoreListing.ps1
