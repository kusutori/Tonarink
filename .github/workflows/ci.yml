name: ci

on:
  push:
  pull_request:

jobs:
  test:
    timeout-minutes: 20
    env:
      # Also applies to format's MSBuild workspace; no mobile workload is needed.
      PortableTransportOnly: 'true'
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-rc.1.26425.128
      - run: dotnet restore LocalSendDotNet.Core.slnx -p:PortableTransportOnly=true
      - run: dotnet format LocalSendDotNet.Core.slnx --no-restore --verify-no-changes
      - run: dotnet build LocalSendDotNet.Core.slnx --no-restore --configuration Release -p:PortableTransportOnly=true
      - name: Core protocol and transport tests
        shell: pwsh
        run: ./tools/Invoke-Tests.ps1 -Suite Core -NoBuild -ResultsDirectory artifacts/test-results/ci
      - name: Shared application and runtime tests
        shell: pwsh
        run: ./tools/Invoke-Tests.ps1 -Suite Application -NoBuild -ResultsDirectory artifacts/test-results/ci
      - name: CLI command and IPC contracts
        shell: pwsh
        run: ./tools/Invoke-Tests.ps1 -Suite CommandLine -NoBuild -ResultsDirectory artifacts/test-results/ci
      - name: Portable transport tests (not mobile-device UI)
        shell: pwsh
        run: ./tools/Invoke-Tests.ps1 -Suite Mobile -NoBuild -ResultsDirectory artifacts/test-results/ci
      - name: Standalone CLI process lifecycle
        shell: pwsh
        run: |
          $cliExecutable = Join-Path $PWD ('src/Tonarink.Cli/bin/Release/net11.0/Tonarink.Cli' + $(if ($IsWindows) { '.exe' } else { '' }))
          ./tools/Invoke-Tests.ps1 -Suite Cli -CliExecutable $cliExecutable -NoBuild -ResultsDirectory artifacts/test-results/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/ci/
          if-no-files-found: error
      - run: dotnet pack src/LocalSendDotNet.Core/LocalSendDotNet.Core.csproj --no-build --configuration Release --output artifacts
      - run: dotnet restore samples/LocalSendDotNet.Sample/LocalSendDotNet.Sample.csproj --source "${{ github.workspace }}/artifacts"
      - run: dotnet build samples/LocalSendDotNet.Sample/LocalSendDotNet.Sample.csproj --no-restore --configuration Release

  cli-tool:
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-22.04 }
          - { rid: linux-arm64, os: ubuntu-22.04-arm }
          - { rid: osx-x64, os: macos-15-intel }
          - { rid: osx-arm64, os: macos-15 }
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Native AOT prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-rc.1.26425.128
      - name: Pack standalone AOT tool and portable archive
        run: |
          dotnet pack src/Tonarink.Cli/Tonarink.Cli.csproj -c Release -o artifacts/cli/nuget -p:CreateRidSpecificToolPackages=false
          if ($LASTEXITCODE -ne 0) { throw 'CLI packing failed.' }
          $version = ([xml](Get-Content src/Tonarink.Cli/Tonarink.Cli.csproj -Raw)).Project.PropertyGroup.Version
          ./tools/Build-CliPortable.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -Version $version -OutputDirectory artifacts/cli/nuget -PackTool
      - uses: actions/setup-dotnet@v5
        if: matrix.rid != 'win-arm64'
        id: installer-sdk
        with:
          dotnet-version: 10.0.x
      - name: Install and run AOT tool on its native platform
        if: matrix.rid != 'win-arm64'
        run: |
          $version = ([xml](Get-Content src/Tonarink.Cli/Tonarink.Cli.csproj -Raw)).Project.PropertyGroup.Version
          ./tools/Verify-CliTool.ps1 -AssetDirectory artifacts/cli/nuget -Version $version -InstallerSdkVersion '${{ steps.installer-sdk.outputs.dotnet-version }}' -RuntimeIdentifier '${{ matrix.rid }}'
      - uses: actions/upload-artifact@v4
        if: always() && matrix.rid != 'win-arm64'
        with:
          name: test-results-cli-distribution-${{ matrix.rid }}
          path: artifacts/test-results/cli-distribution/
          if-no-files-found: error

  ui:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-rc.1.26425.128
      - run: dotnet restore src/Tonarink.App/Tonarink.App.csproj -p:Platform=x64
      - run: dotnet restore src/Tonarink.ExplorerCommand/Tonarink.ExplorerCommand.csproj -p:Platform=x64 -r win-x64
      - run: dotnet restore src/Tonarink.WidgetProvider/Tonarink.WidgetProvider.csproj -p:Platform=x64 -r win-x64
      - run: dotnet format src/Tonarink.App/Tonarink.App.csproj --no-restore --verify-no-changes
      - run: dotnet format src/Tonarink.ExplorerCommand/Tonarink.ExplorerCommand.csproj --no-restore --verify-no-changes
      - run: dotnet format src/Tonarink.WidgetProvider/Tonarink.WidgetProvider.csproj --no-restore --verify-no-changes
      - run: dotnet build src/Tonarink.App/Tonarink.App.csproj --no-restore --configuration Release -p:Platform=x64
      - name: Real WinUI controls and settings behavior
        shell: pwsh
        run: ./tools/Invoke-Tests.ps1 -Suite WinUI -ResultsDirectory artifacts/test-results/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-winui
          path: artifacts/test-results/ci/winui/
          if-no-files-found: error
      - run: >-
          dotnet publish src/Tonarink.ExplorerCommand/Tonarink.ExplorerCommand.csproj
          --no-restore --configuration Release -r win-x64 -p:Platform=x64
      - run: >-
          dotnet publish src/Tonarink.WidgetProvider/Tonarink.WidgetProvider.csproj
          --no-restore --configuration Release -r win-x64 -p:Platform=x64

  blazor-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-rc.1.26425.128
      - run: dotnet restore src/Tonarink.Web/Tonarink.Web.csproj
      - run: dotnet restore tests/Tonarink.Application.Tests/Tonarink.Application.Tests.csproj
      - run: dotnet format src/Tonarink.Web/Tonarink.Web.csproj --no-restore --verify-no-changes
      - run: dotnet format tests/Tonarink.Application.Tests/Tonarink.Application.Tests.csproj --no-restore --verify-no-changes
      - run: dotnet build src/Tonarink.Web/Tonarink.Web.csproj --no-restore --configuration Release
      - name: Render production Blazor components
        shell: pwsh
        run: ./tools/Invoke-Tests.ps1 -Suite Blazor -ResultsDirectory artifacts/test-results/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-blazor
          path: artifacts/test-results/ci/blazor/
          if-no-files-found: error
      - name: Smoke-test authenticated Web host
        env:
          TONARINK_WEB_PASSWORD: ci-secret
        run: |
          dotnet run --project src/Tonarink.Web/Tonarink.Web.csproj --no-build --configuration Release --urls http://127.0.0.1:5199 > /tmp/tonarink-web.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..30}; do curl -s http://127.0.0.1:5199/ >/dev/null && break || sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5199/)" = "401"
          test "$(curl -s -u user:ci-secret -o /dev/null -w '%{http_code}' http://127.0.0.1:5199/)" = "200"
          test "$(curl -s -u user:ci-secret -o /dev/null -w '%{http_code}' http://127.0.0.1:5199/manifest.webmanifest)" = "200"

  hybrid-android:
    # The MAUI/Hybrid app is still under development. Keep the CI recipe ready,
    # but do not make Reactor app maintenance and releases depend on it yet.
    if: ${{ false }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-rc.1.26425.128
      - run: dotnet workload install maui
      - run: dotnet restore src/Tonarink.Hybrid/Tonarink.Hybrid.csproj
      - run: dotnet restore tests/LocalSendDotNet.Core.Mobile.Tests/LocalSendDotNet.Core.Mobile.Tests.csproj
      - run: dotnet format src/Tonarink.Hybrid/Tonarink.Hybrid.csproj --no-restore --verify-no-changes
      - run: dotnet format tests/LocalSendDotNet.Core.Mobile.Tests/LocalSendDotNet.Core.Mobile.Tests.csproj --no-restore --verify-no-changes
      - run: >-
          dotnet publish src/Tonarink.Hybrid/Tonarink.Hybrid.csproj
          --no-restore --configuration Release --framework net11.0-android
          -p:AndroidPackageFormats=apk
      - run: dotnet test --project tests/LocalSendDotNet.Core.Mobile.Tests --no-restore --configuration Debug --minimum-expected-tests 4 --zero-tests-policy strict --timeout 3m

  hybrid-ios:
    # The iOS Share Extension requires an Apple signing identity and provisioning
    # profile even for the current simulator build. Keep the recipe ready, but do
    # not make Reactor releases depend on mobile signing infrastructure yet.
    if: ${{ false }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-rc.1.26425.128
      - run: dotnet workload install maui
      - run: dotnet restore src/Tonarink.Hybrid/Tonarink.Hybrid.csproj
      - run: dotnet format src/Tonarink.Hybrid/Tonarink.Hybrid.csproj --no-restore --verify-no-changes
      - run: >-
          dotnet build src/Tonarink.Hybrid/Tonarink.Hybrid.csproj
          --no-restore --configuration Debug --framework net11.0-ios
          -p:RuntimeIdentifier=iossimulator-arm64
