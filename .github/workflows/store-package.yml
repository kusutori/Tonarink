name: Build Microsoft Store package

on:
  push:
    tags:
      - "app-v[0-9]+.[0-9]+.[0-9]+"
      - "app-v[0-9]+.[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Store MSIX version, for example 1.0.5 or 1.0.5.0"
        required: true
        type: string
      source_ref:
        description: "Git ref to package; defaults to the selected workflow ref"
        required: false
        type: string

permissions:
  contents: read

env:
  APP_PROJECT: src/Tonarink.App/Tonarink.App.csproj
  APP_MANIFEST: src/Tonarink.App/Package.appxmanifest
  STORE_IDENTITY_NAME: kusutori.Tonarink
  STORE_PUBLISHER: CN=90217693-C2B0-4C16-BFEE-57A2BD9A719F
  STORE_PUBLISHER_DISPLAY_NAME: kusutori

jobs:
  build:
    name: Build Store Native AOT MSIX ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
            architecture: x64
          - platform: ARM64
            rid: win-arm64
            architecture: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-rc.1.26425.128

      - name: Install WinApp CLI
        shell: pwsh
        run: ./tools/Install-WinAppCli.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'winapp-cli')

      - name: Resolve Store package version
        id: package
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $version = $env:REQUESTED_VERSION.Trim() -replace '^app-', '' -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "Version '$version' must use MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH.REVISION."
          }
          if (($version.Split('.')).Count -eq 3) {
            $version = "$version.0"
          }
          $parts = @($version.Split('.') | ForEach-Object { [int]$_ })
          if ($parts | Where-Object { $_ -gt 65535 }) {
            throw "Every MSIX version component must be between 0 and 65535: '$version'."
          }
          if ($parts[3] -ne 0) {
            throw "Microsoft Store packages require a zero revision component: '$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Stamp Microsoft Store identity
        shell: pwsh
        run: |
          ./build/Set-PackageIdentity.ps1 `
            -ManifestPath $env:APP_MANIFEST `
            -Tag '${{ steps.package.outputs.version }}' `
            -IdentityName $env:STORE_IDENTITY_NAME `
            -Publisher $env:STORE_PUBLISHER `
            -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME

      - name: Restore Native AOT application
        shell: pwsh
        run: |
          dotnet restore $env:APP_PROJECT `
            -p:Platform=${{ matrix.platform }} `
            -p:NativeAot=true `
            -r ${{ matrix.rid }}
          dotnet restore src/Tonarink.ExplorerCommand/Tonarink.ExplorerCommand.csproj `
            -p:Platform=${{ matrix.platform }} `
            -r ${{ matrix.rid }}

      - name: Publish and pack unsigned Store Native AOT MSIX with WinApp CLI
        id: build
        shell: pwsh
        run: |
          $layout = Join-Path $env:RUNNER_TEMP 'store-msix-layout'
          dotnet publish $env:APP_PROJECT --no-restore -c Release `
            -r ${{ matrix.rid }} `
            -p:Platform=${{ matrix.platform }} `
            -p:NativeAot=true `
            -p:TonarinkPackaged=false `
            -p:WindowsPackageType=None `
            -p:TonarinkWidgets=false `
            -p:Version=${{ steps.package.outputs.version }} `
            -o $layout
          if ($LASTEXITCODE -ne 0) {
            throw 'Publishing the Store Native AOT layout failed for ${{ matrix.platform }}.'
          }

          foreach ($requiredFile in @('Tonarink.exe', 'Tonarink.pri')) {
            if (-not (Test-Path (Join-Path $layout $requiredFile))) {
              throw "Store Native AOT layout is missing $requiredFile."
            }
          }

          Get-ChildItem -LiteralPath $layout -Filter '*.pdb' -File |
            Remove-Item -Force -ErrorAction SilentlyContinue

          $assets = Join-Path $layout 'Assets'
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          Copy-Item 'src/Tonarink.App/Assets/*.png' -Destination $assets
          Copy-Item 'src/Tonarink.App/Assets/*.ico' -Destination $assets

          $manifestPath = Join-Path $layout 'AppxManifest.xml'
          Copy-Item $env:APP_MANIFEST -Destination $manifestPath
          [xml]$manifest = Get-Content -LiteralPath $manifestPath -Raw
          $manifest.Package.Identity.SetAttribute('ProcessorArchitecture', '${{ matrix.architecture }}')
          $manifest.Package.Applications.Application.SetAttribute('EntryPoint', 'Windows.FullTrustApplication')
          $settings = [Xml.XmlWriterSettings]::new()
          $settings.Indent = $true
          $settings.Encoding = [Text.UTF8Encoding]::new($false)
          $writer = [Xml.XmlWriter]::Create($manifestPath, $settings)
          try {
            $manifest.Save($writer)
          }
          finally {
            $writer.Dispose()
          }

          ./tools/New-AotMsixResourcesPri.ps1 -LayoutPath $layout
          if (-not (Test-Path (Join-Path $layout 'resources.pri'))) {
            throw 'The Store Native AOT MSIX layout is missing resources.pri.'
          }

          $destination = Join-Path $env:RUNNER_TEMP 'Tonarink-Store-${{ steps.package.outputs.version }}-${{ matrix.platform }}.msix'
          winapp package $layout --skip-pri --output $destination
          if ($LASTEXITCODE -ne 0) {
            throw 'WinApp CLI failed to pack the Store Native AOT MSIX.'
          }

          $layoutArchive = Join-Path $env:RUNNER_TEMP 'store-layout-${{ matrix.platform }}.zip'
          Compress-Archive -Path (Join-Path $layout '*') -DestinationPath $layoutArchive -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($destination)
          try {
            $entry = $archive.GetEntry('AppxManifest.xml')
            if ($null -eq $entry) {
              throw 'The generated package has no AppxManifest.xml.'
            }
            $primaryPri = $archive.GetEntry('resources.pri')
            if ($null -eq $primaryPri -or $primaryPri.Length -eq 0) {
              throw 'The generated Store MSIX has no primary resources.pri.'
            }
            $reader = [IO.StreamReader]::new($entry.Open())
            try {
              [xml]$manifest = $reader.ReadToEnd()
            }
            finally {
              $reader.Dispose()
            }
          }
          finally {
            $archive.Dispose()
          }

          $identity = $manifest.Package.Identity
          if ($identity.Name -ne $env:STORE_IDENTITY_NAME -or
              $identity.Publisher -ne $env:STORE_PUBLISHER -or
              $identity.Version -ne '${{ steps.package.outputs.version }}' -or
              $identity.ProcessorArchitecture -ne '${{ matrix.architecture }}') {
            throw "Generated package identity is invalid: $($identity.OuterXml)"
          }

      - name: Upload architecture package
        uses: actions/upload-artifact@v4
        with:
          name: store-msix-${{ matrix.platform }}
          path: ${{ runner.temp }}/Tonarink-Store-${{ steps.package.outputs.version }}-${{ matrix.platform }}.msix
          if-no-files-found: error

      - name: Upload architecture layout for bundling
        uses: actions/upload-artifact@v4
        with:
          name: store-layout-${{ matrix.platform }}
          path: ${{ runner.temp }}/store-layout-${{ matrix.platform }}.zip
          if-no-files-found: error

  bundle:
    name: Create Store submission bundle
    needs: build
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install WinApp CLI
        shell: pwsh
        run: ./tools/Install-WinAppCli.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'winapp-cli')

      - name: Download architecture packages
        uses: actions/download-artifact@v4
        with:
          pattern: store-msix-*
          path: packages
          merge-multiple: true

      - name: Download architecture layouts
        uses: actions/download-artifact@v4
        with:
          pattern: store-layout-*
          path: layouts
          merge-multiple: true

      - name: Resolve Store package version
        id: package
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $version = $env:REQUESTED_VERSION.Trim() -replace '^app-', '' -replace '^v', ''
          if (($version.Split('.')).Count -eq 3) {
            $version = "$version.0"
          }
          if ([int]$version.Split('.')[3] -ne 0) {
            throw "Microsoft Store packages require a zero revision component: '$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create and inspect MSIX bundle with WinApp CLI
        shell: pwsh
        run: |
          foreach ($platform in @('x64', 'ARM64')) {
            $archivePath = Join-Path 'layouts' "store-layout-$platform.zip"
            if (-not (Test-Path -LiteralPath $archivePath)) {
              throw "Missing Store layout archive: $archivePath"
            }
            Expand-Archive -LiteralPath $archivePath -DestinationPath (Join-Path 'layouts' $platform)
          }

          $x64Layout = Join-Path 'layouts' 'x64'
          $arm64Layout = Join-Path 'layouts' 'ARM64'
          foreach ($layout in @($x64Layout, $arm64Layout)) {
            if (-not (Test-Path (Join-Path $layout 'AppxManifest.xml'))) {
              throw "The Store bundle layout has no AppxManifest.xml: $layout"
            }
          }
          $bundle = Join-Path $env:RUNNER_TEMP 'Tonarink-Store-${{ steps.package.outputs.version }}.msixbundle'
          winapp package $x64Layout $arm64Layout --skip-pri --output $bundle
          if ($LASTEXITCODE -ne 0) {
            throw 'WinApp CLI failed to create the Store MSIX bundle.'
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($bundle)
          try {
            $entry = $archive.GetEntry('AppxMetadata/AppxBundleManifest.xml')
            if ($null -eq $entry) {
              throw 'The generated bundle has no AppxBundleManifest.xml.'
            }
            $reader = [IO.StreamReader]::new($entry.Open())
            try {
              [xml]$manifest = $reader.ReadToEnd()
            }
            finally {
              $reader.Dispose()
            }
          }
          finally {
            $archive.Dispose()
          }

          $identity = $manifest.Bundle.Identity
          $architectures = @($manifest.Bundle.Packages.Package.Architecture | Sort-Object -Unique)
          if ($identity.Name -ne $env:STORE_IDENTITY_NAME -or
              $identity.Publisher -ne $env:STORE_PUBLISHER -or
              $identity.Version -ne '${{ steps.package.outputs.version }}' -or
              $architectures.Count -ne 2 -or
              'x64' -notin $architectures -or
              'arm64' -notin $architectures) {
            throw "Generated bundle is invalid: identity=$($identity.OuterXml), architectures=$($architectures -join ',')."
          }

      - name: Upload Store submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tonarink-Store-${{ steps.package.outputs.version }}
          path: |
            ${{ runner.temp }}/Tonarink-Store-${{ steps.package.outputs.version }}.msixbundle
            packages/*.msix
          if-no-files-found: error
